<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout Canceled — Remedi’s Closet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    body{background:#0b0d10;color:#e9ecef}
    .banner{background:#842029;border:1px solid #842029;border-radius:12px;color:#ffe3e3;padding:14px 16px}
    .banner .title{font-weight:800;letter-spacing:.02em}
    .shell{max-width:900px;margin:96px auto 40px;padding:0 16px}
    .cardish{background:#101826;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:24px}
    a.btn-dark{background:#101826;border-color:#1b2433}
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container"><a class="navbar-brand" href="index.html">REMEDI’S CLOSET</a></div>
  </nav>

  <main class="shell">
    <div class="banner mb-3">
      <div class="title">Checkout canceled</div>
      <div>No charge was made. You can safely try again.</div>
    </div>

    <section class="cardish">
      <h1 class="h4 fw-bold mb-2">Want to finish later?</h1>
      <p class="text-white-50 mb-3">Your cart is still saved on this device.</p>
      <div class="d-flex gap-2">
        <a href="checkout.html" class="btn btn-light">Return to checkout</a>
        <a href="shop.html" class="btn btn-dark">Keep shopping</a>
      </div>
    </section>
  </main>

  <footer class="text-center text-white-50 small py-4">© <span id="y"></span> Remedi’s Closet</footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
