<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inventory Badge Test — Remedi’s Closet</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous" defer></script>

<style>
  body {
    background: #0f1114;
    color: #e6e9ee;
    font-family: "Nunito", sans-serif;
    padding: 2rem;
  }
  .product-card {
    position: relative;
    background: #181c22;
    border: 1px solid #2a3037;
    border-radius: 1rem;
    box-shadow: 0 12px 26px rgba(0,0,0,.35);
    overflow: hidden;
    transition: transform .2s;
  }
  .product-card:hover { transform: translateY(-2px); }
  .product-thumb {
    position: relative;
    aspect-ratio: 1/1;
    background: #11151a;
  }
  .product-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .product-glass {
    padding: 1rem;
    background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.1));
  }
  .inv-badge {
    position: absolute;
    top: .6rem; right: .6rem;
    min-width: 2.6rem;
    padding: .28rem .58rem;
    border-radius: .55rem;
    background: rgba(255, 56, 56, .28);
    border: 1px solid rgba(255, 56, 56, .6);
    color: #fff;
    font-weight: 900;
    font-size: .85rem;
    letter-spacing: .02em;
    backdrop-filter: blur(6px);
    box-shadow: 0 6px 14px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);
    text-shadow: 0 1px 0 rgba(0,0,0,.25);
  }
</style>
</head>
<body>

<div class="container text-center">
  <h1 class="mb-4">Inventory Badge Test</h1>
  <button id="testBtn" class="btn btn-danger mb-4"><i class="fas fa-sync"></i> Test Render</button>

  <div id="productsGrid" class="row row-cols-1 row-cols-md-3 g-4 justify-content-center"></div>
</div>

<script>
const PRODUCTS = [
  { name: 'Remedi Hat', sku: 'RC-HAT-001', price: 35, inventory: 1, image: 'https://via.placeholder.com/400x400?text=Hat' },
  { name: 'Remedi Tee', sku: 'RC-TEE-001', price: 45, inventory: 11, image: 'https://via.placeholder.com/400x400?text=Tee' }
];

function cardHTML(p){
  const inv = p.inventory ? `<span class="inv-badge">${p.inventory} left</span>` : '';
  return `
  <div class="col">
    <article class="product-card">
      <div class="product-thumb">${inv}<img src="${p.image}" alt="${p.name}"></div>
      <div class="product-glass">
        <h5>${p.name}</h5>
        <p class="mb-1">$${p.price}</p>
        <button class="btn btn-outline-danger w-100"><i class="fas fa-key me-1"></i> Add to Cart</button>
      </div>
    </article>
  </div>`;
}

function render(){
  document.getElementById('productsGrid').innerHTML = PRODUCTS.map(cardHTML).join('');
}

document.getElementById('testBtn').addEventListener('click', render);
render();
</script>

</body>
</html>
